# Publishes the site to GitHub Pages every time something is pushed to "main".
# The site then lives at  https://uxpugovkin.github.io/abac/
#
# One-time setup on GitHub:  repo → Settings → Pages → Source: "GitHub Actions".

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you start it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, only the newest one is published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site is served from /abac (the repo name), see vite.config.js.
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
